<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حكايتنا ❤️</title>
    <style>
        body { background: #000; color: white; text-align: center; font-family: Arial; margin: 0; overflow-x: hidden; }
        .slide { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; scroll-snap-align: start; padding: 20px; box-sizing: border-box; }
        .container { scroll-snap-type: y mandatory; overflow-y: scroll; height: 100vh; scroll-behavior: smooth; }
        .photo { width: 90%; max-width: 350px; border-radius: 15px; border: 2px solid #ff4d6d; box-shadow: 0 0 20px #ff4d6d; margin-bottom: 20px; }
        .caption { font-size: 22px; color: #ff4d6d; font-weight: bold; text-shadow: 2px 2px 5px #000; }
        #days-count { font-size: 60px; color: #ff4d6d; font-weight: bold; margin-top: 20px; }
        .heart-loader { font-size: 50px; animation: beat 0.8s infinite; }
        @keyframes beat { to { transform: scale(1.3); } }
        
        /* زر الموسيقى السحري */
        .play-btn {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 0 15px #ff4d6d;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <audio id="myAudio" loop>
      <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div class="slide">
            <div class="heart-loader">❤️</div>
            <h1 style="font-size: 20px;">من يوم ما بدأنا...</h1>
            <div id="days-count">0</div>
            <p>يوم من الحب</p>
            <button id="start-btn" class="play-btn" onclick="startStory()">ابدئي الحكاية 🎵</button>
            <p style="font-size: 12px; color: #555; margin-top: 15px;">(اضغطي واسحبي لفوق ☝️)</p>
        </div>

        <div class="slide">
            <img src="1.jpg" class="photo">
            <p class="caption">أول صورة لينا وأول مرة نأكل فيها ومن وهمي بجد كان يوم جامد🥰</p>
        </div>

        <div class="slide">
            <img src="2.jpg" class="photo">
            <p class="caption">اكتر صورة بحبها والاقرب الي قلبي اولا علشان أنت فيها ثانيا ع كل ما أبص فيها عمري ما أزهق</p>
        </div>

        <div class="slide">
            <img src="3.jpg" class="photo">
            <p class="caption">I love you My Soulmate ❤️🫂</p>
        </div>

        <div class="slide">
            <img src="4.jpg" class="photo">
            <p class="caption">بحبك إلى اللانهاية وما بعدها❤️💫💍</p>
        </div>
    </div>

    <script>
        function startStory() {
            var audio = document.getElementById("myAudio");
            audio.play();
            
            // تغيير نص الزر ليعرف المستخدم أن الموسيقى تعمل
            document.getElementById("start-btn").innerText = "الموسيقى تعمل 🎵";
            document.getElementById("start-btn").style.background = "#28a745"; // لون أخضر
            document.getElementById("start-btn").style.boxShadow = "0 0 15px #28a745";
        }

        // كود العداد
        const startDate = new Date(2025, 10, 21); 
        const today = new Date();
        const finalDays = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
        
        let current = 0;
        const counterElement = document.getElementById('days-count');
        const interval = setInterval(() => {
            if (current >= finalDays) {
                counterElement.innerText = finalDays;
                clearInterval(interval);
            } else {
                current += Math.ceil(finalDays / 50); 
                counterElement.innerText = current;
            }
        }, 30);
    </script>
</body>
</html>
